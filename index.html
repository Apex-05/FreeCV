<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeCV</title>
    <meta name="description" content="Create stunning professional resumes instantly with 10 expert templates. No signup required. Your data stays in your browser. Download as PDF for free." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="FreeCV" />
    <meta property="og:description" content="10 professional templates, live editing, free PDF export. No signup. Your data stays local." />

    <!-- Landscape preview — used by most link-preview contexts -->
    <meta property="og:image"        content="/FreeCV.webp" />
    <meta property="og:image:type"   content="image/webp" />

    <!-- Square / portrait preview — used in 1:1 contexts (e.g. WhatsApp, iMessage) -->
    <meta property="og:image"        content="/FreeCV1x1.webp" />
    <meta property="og:image:type"   content="image/webp" />
    <meta property="og:image:width"  content="1080" />
    <meta property="og:image:height" content="1080" />

    <!-- Twitter / X — large card uses the landscape image -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="FreeCV" />
    <meta name="twitter:description" content="10 professional templates, live editing, free PDF export. No signup. Your data stays local." />
    <meta name="twitter:image"       content="/FreeCV.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&family=Lato:wght@300;400;700&family=Open+Sans:wght@300;400;600;700&family=Source+Sans+3:wght@300;400;600;700&family=Nunito:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Raleway:wght@300;400;600;700;800&family=Josefin+Sans:wght@300;400;600;700&family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;600;700&family=EB+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
